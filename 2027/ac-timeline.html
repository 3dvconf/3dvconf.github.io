<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AC Review Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1D2A39;
    --paper:#F6F8FB;
    --card:#F1F5FD;
    --line:#D8E1F0;
    --steel:#3A6DD8;
    --red:#D96565;
    --green:#1EA672;
    --muted:#5C6F86;
    --passed:#A7AFBA;
    --passed-fill:rgba(167, 175, 186, 0.06);
    --passed-border:rgba(167, 175, 186, 0.12);
    --done-bg:#EAF0F9;
    --shadow: rgba(20, 32, 49, 0.10);
    --badge-bg: rgba(58, 109, 216, 0.08);
    --glow: rgba(58, 109, 216, 0.18);
    --pulse: rgba(58, 109, 216, 0.55);
    --milestone-bg: rgba(29, 42, 57, 0.06);
    --milestone-border: rgba(29, 42, 57, 0.18);
    --footer-bg:#F5F5F5;
    --footer-muted:#6C757D;
    --footer-link:#007BFF;
    --footer-link-hover:#0056B3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="dark"]{
    --ink:#EEF5FF;
    --paper:#000000;
    --card:#0D0D0E;
    --line:#1D1F22;
    --steel:#6E9BFF;
    --red:#F07A7A;
    --green:#2FCC8E;
    --muted:#A9B8C8;
    --passed:#777E86;
    --passed-fill:rgba(119, 126, 134, 0.12);
    --passed-border:rgba(119, 126, 134, 0.22);
    --done-bg:#121416;
    --shadow: rgba(0, 0, 0, 0.78);
    --badge-bg: rgba(110, 155, 255, 0.12);
    --glow: rgba(110, 155, 255, 0.12);
    --pulse: rgba(110, 155, 255, 0.55);
    --milestone-bg: rgba(238, 245, 255, 0.08);
    --milestone-border: rgba(238, 245, 255, 0.18);
    --footer-bg:#16181B;
    --footer-muted:#A9B8C8;
    --footer-link:#6E9BFF;
    --footer-link-hover:#A8C0FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at top, var(--glow), transparent 30%), var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:48px 24px 24px;}
  header{margin-bottom:30px;}
  .hero-image-wrap{
    margin:0 0 28px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:0 18px 50px var(--shadow);
  }
  .hero-image-wrap a{display:block;}
  .hero-image-wrap a:focus-visible{outline:3px solid var(--steel);outline-offset:-3px;}
  .hero-image-wrap img{
    display:block;
    width:100%;
    height:auto;
    object-fit:cover;
  }
  h1{
    font-family:'Lora',Georgia,serif;
    font-weight:600;
    font-size:clamp(1.6rem,4vw,2.1rem);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted);font-size:0.95rem;max-width:60ch;}
  .today-controls{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-top:18px;
  }
  .today-badge{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:0;padding:7px 14px;
    border:1px solid var(--line);border-radius:999px;
    font-size:0.85rem;color:var(--ink);
    background:var(--card);
  }
  .today-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}

  .header-controls{
    margin-top:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:0.85rem;color:var(--muted);
  }
  .header-controls button{
    font-family:inherit;font-size:0.8rem;font-weight:600;cursor:pointer;
    border-radius:6px;padding:6px 12px;border:1px solid var(--steel);
    background:var(--steel);color:#fff;
  }
  .header-controls button.ghost{
    background:transparent;color:var(--muted);border-color:var(--line);
    font-weight:500;
  }
  .theme-toggle{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-width:108px;
  }
  .theme-icon{display:none;width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .theme-toggle[data-next-theme="light"] .eye-open,
  .theme-toggle[data-next-theme="dark"] .eye-closed{display:block;}

  .timeline{position:relative;margin-top:8px;}
  .timeline::before{
    content:"";position:absolute;left:126px;top:6px;bottom:6px;width:1px;
    background:var(--line);
  }
  @media (max-width:520px){
    .timeline::before{left:76px;}
  }

  .step{
    position:relative;
    display:grid;
    grid-template-columns:110px 1fr;
    gap:20px;
    padding:22px 0;
    border-bottom:1px solid var(--line);
  }
  .step:last-child{border-bottom:none;}
  @media (max-width:520px){
    .step{grid-template-columns:60px 1fr;gap:14px;}
  }

  .datecol{padding-top:2px;}
  .datecol .range{
    display:inline-block;
    font-size:0.88rem;font-weight:600;color:var(--ink);
  }
  .datecol .meta{
    margin-top:4px;font-size:0.7rem;letter-spacing:0.04em;
    text-transform:uppercase;color:var(--muted);
  }
  .step.milestone .datecol .range,
  .step.milestone .title{
    font-style:italic;
  }
  .step.milestone .title{font-size:1.12rem;font-weight:700;}
  .step.milestone .datecol .range{
    padding:7px 10px;border-radius:999px;
    background:var(--milestone-bg);
    border:1px solid var(--milestone-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .datecol .dayname{
    font-size:0.72rem;color:var(--muted);margin-top:2px;
  }

  .marker{
    position:absolute;left:122px;top:26px;
    width:9px;height:9px;border-radius:50%;
    background:var(--ink);
    border:2px solid var(--paper);
    z-index:2;
  }
  .step.milestone .marker{border-radius:1px;transform:rotate(45deg);}
  @media (max-width:520px){ .marker{left:72px;} }

  .step.current .marker{
    background:var(--green);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .step.done .marker{background:var(--passed);}

  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 var(--pulse);}
    50%{box-shadow:0 0 0 6px rgba(0,0,0,0);}
  }
  @media (prefers-reduced-motion: reduce){
    .step.current .marker{animation:none;}
  }

  .title{
    font-family:'Lora',Georgia,serif;
    font-weight:600;
    font-size:1.05rem;
    margin:0 0 6px;
  }
  .step.done .title,
  .step.done .datecol .range,
  .step.done .datecol .meta{
    text-decoration:line-through;
    text-decoration-color:var(--passed);
    color:var(--passed);
  }
  .step.current .title{color:var(--green);}
  .step.current .datecol .range{color:var(--green);font-weight:600;}
  .step.current.milestone .datecol .range{
    font-weight:700;
    background:rgba(30,166,114,0.12);
    border-color:rgba(30,166,114,0.34);
  }
  .step.current .datecol .meta{color:var(--green);}
  .step.done.milestone .datecol .range{
    background:var(--passed-fill);
    border-color:var(--passed-border);
  }
  .step.upcoming .datecol .meta{color:var(--ink);}

  .status-tag{
    display:inline-block;font-size:0.72rem;font-weight:600;
    letter-spacing:0.02em;
    padding:2px 8px;border-radius:5px;margin-bottom:8px;
  }
  .step.current .status-tag{background:rgba(30,166,114,0.12);color:var(--green);}
  .step.done .status-tag{background:var(--done-bg);color:var(--passed);}
  .step.upcoming .status-tag{background:rgba(123,135,154,0.10);color:var(--ink);}

  .step-details{
    display:block;
    width:100%;
  }
  .step-details > summary{
    list-style:none;
    cursor:pointer;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"status arrow" "title arrow";
    align-items:center;
    column-gap:12px;
    row-gap:4px;
    padding:4px 0;
  }
  .step-details > summary::-webkit-details-marker{display:none;}
  .step-details > summary::after{
    content:"▸";
    font-size:1.3rem;
    line-height:1;
    color:var(--muted);
    grid-area:arrow;
    transition:transform 0.15s ease;
  }
  .step-details[open] > summary::after{transform:rotate(90deg);}
  .step-details > summary .title{
    grid-area:title;
    margin:0;
  }
  .step-details > summary .status-tag{
    grid-area:status;
    justify-self:start;
    margin-bottom:0;
  }
  .step-details .howto{margin-top:8px;}
  .past-deadlines{display:block;width:100%;}
  .past-deadlines > summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:4px 0;
  }
  .past-deadlines > summary::-webkit-details-marker{display:none;}
  .past-label{font-size:0.92rem;font-weight:600;color:var(--passed);}
  .past-count{
    font-size:0.72rem;font-weight:600;color:var(--passed);
    background:var(--done-bg);border-radius:5px;padding:2px 8px;
  }
  .past-deadlines > summary::after{
    content:"▸";font-size:1.45rem;line-height:1;color:var(--passed);
    margin-left:auto;transition:transform 0.15s ease;
  }
  .past-deadlines[open] > summary::after{transform:rotate(90deg);}
  .past-timeline{margin-top:8px;}

  ul.tasks{margin:0;padding-left:18px;color:var(--ink);}
  .step.done ul.tasks{color:var(--passed);}
  ul.tasks li{margin:3px 0;font-size:0.92rem;}

  .howto{margin:2px 0 8px;}
  .howto summary{
    cursor:pointer;font-size:0.78rem;font-weight:600;color:var(--steel);
    list-style:none;display:inline-flex;align-items:center;gap:4px;
    padding:2px 0;
  }
  .howto summary::-webkit-details-marker{display:none;}
  .howto summary::before{
    content:"▸";display:inline-block;font-size:0.7rem;
    transition:transform 0.15s ease;
  }
  .howto[open] summary::before{transform:rotate(90deg);}
  .howto .howto-body{
    margin:6px 0 4px 14px;padding:8px 12px;
    background:var(--card);border-left:2px solid var(--steel);
    border-radius:4px;font-size:0.85rem;color:var(--ink);
  }
  .step.done .howto .howto-body{color:var(--muted);}
  .howto .howto-body a{color:var(--steel);}
  @media (prefers-reduced-motion: reduce){
    .howto summary::before{transition:none;}
  }

  .timeline-note{
    max-width:860px;margin:0 auto 18px;padding:0 24px;
    color:var(--muted);font-size:0.8rem;
  }
  .site-footer{
    width:100%;min-height:60px;margin:0;padding:0;
    background:var(--footer-bg);color:var(--footer-muted);text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    font-size:16px;line-height:60px;
  }
  .site-footer .container{width:100%;margin:0 auto;padding:0 15px;}
  @media (min-width:576px){.site-footer .container{max-width:540px;}}
  @media (min-width:768px){.site-footer .container{max-width:720px;}}
  @media (min-width:992px){.site-footer .container{max-width:960px;}}
  @media (min-width:1200px){.site-footer .container{max-width:1140px;}}
  .site-footer-muted{color:var(--footer-muted);}
  .site-footer a{color:var(--footer-link);text-decoration:none;}
  .site-footer a:hover{color:var(--footer-link-hover);text-decoration:underline;}
  .site-footer a:focus-visible{outline:2px solid var(--footer-link);outline-offset:3px;}
</style>
</head>

<script>
// [ label, start "YYYY-MM-DD", end "YYYY-MM-DD" or null, whatTasks[] ]
const steps = [
  ["Reviewer assignments finalized", "2026-09-24", null,
    [
      {text:"Recommend minimum 10 reviewers",
       howTo:{type:"text", body:"In OpenReview, go to your track's Area Chair Console → \"Reviewer Assignment.\" Use the affinity/bid score columns to sort candidates per paper, then select at least 10 before finalizing — the system will let you submit with fewer, but flag anything under 10 for a second pass."}},
      {text:"Assign preference scores (10 = best)"},
      {text:"Verify expertise match for top selections",
        howTo:{type:"text", body:"Reviewers have been asked to contact you directly about issues. For a conflict, expertise mismatch, or missing reviewer, email the PCs at <a href=\"mailto:3dv27-pcs@googlegroups.com\">3dv27-pcs@googlegroups.com</a> with the paper ID and details. You may remove a reviewer and invite a replacement using <a href=\"https://tinyurl.com/3dv27acmodifyreviewer\" target=\"_blank\" rel=\"noopener noreferrer\">the OpenReview instructions</a>, but only for a real conflict or expertise mismatch. An invitation is not an assignment, so a replacement may decline. Prefer suitable reviewers with fewer than 3 papers when possible; if no reviewer is available, contact the PCs promptly. Reviewer assignments are available in <a href=\"https://openreview.net/group?id=3DV/2027/Conference/Reviewers#assigned-submissions\" target=\"_blank\" rel=\"noopener noreferrer\">OpenReview</a>."}},
      {text:"Avoid overloaded reviewers"},
    ]],
  ["Reviewing in progress", "2026-09-27", "2026-10-16",
    [
      {text:"Check progress and quality of submitted reviews",
        howTo:{type:"text", body:"Area Chair Console → \"Reviewer Progress\" shows a live count of submitted vs. assigned reviews per reviewer. Open a submitted review directly from that table to spot-check quality before the deadline reminders go out. Check length, substance, and possible signs of LLM-generated text, focusing on whether the review is useful enough to support a decision about the paper."}},
      {text:"Remind reviewers as the deadline nears (1 week, 2 days, and day-of)"},
      {text:"Track reviewers who flagged they'll be late",
       howTo:{type:"text", body:"The deadline is strict. Grace periods are only considered when a reviewer contacts you well in advance, so ask reviewers to flag delays as early as possible."}},
      {text:"Familiarize yourself with the reviewer guidelines",
       howTo:{type:"link", label:"3DV 2027 reviewer guidelines", url:"https://3dvconf.github.io/2027/reviewer-guidelines/"}},
    ], "Reviewing Period"],
  ["Reviews due", "2026-10-16", null, []],
  ["Missing and emergency reviews", "2026-10-17", null,
    [
      {text:"Secure emergency reviews for papers with missing coverage",
       howTo:{type:"text", body:"Oct 17-25 is for securing emergency reviews, not chasing reviewers who have not communicated. See the <a href=\"https://tinyurl.com/3dv27acmodifyreviewer\" target=\"_blank\" rel=\"noopener noreferrer\">OpenReview instructions on assigning emergency reviewers</a>. If you cannot identify a suitable emergency reviewer, contact the PCs."}},
      {text:"Check the quality of submitted reviews",
       howTo:{type:"text", body:"Area Chair Console → \"Reviewer Progress\" shows a live count of submitted vs. assigned reviews per reviewer. Open a submitted review directly from that table to spot-check quality before the deadline reminders go out. Check length, substance, and possible signs of LLM-generated text, focusing on whether the review is useful enough to support a decision about the paper."}},
    ]],
  ["Pre-rebuttal discussions", "2026-10-18", "2026-10-25",
    [
      {text:"Check all scores and reviews"},
      {text:"Follow up on missing reviews by securing emergency coverage",
       howTo:{type:"text", body:"Use Oct 17-25 to secure emergency reviews rather than chase reviewers who have not communicated."}},
      {text:"Discuss with reviewers whether author clarification is needed",
       howTo:{type:"text", body:"A short author response is optional and intended only for papers that truly need clarification. Decide with reviewers which papers need author input. Reviewers should identify clarification topics in their reviews; summarize the questions and relevant discussion in the initial meta-review."}},
      {text:"Draft an initial meta-review and proposed decision",
       howTo:{type:"text", body:"The initial decision for a borderline paper should be conditional accept, conditional reject, or requires clarification, based on the submission, reviews, and pre-rebuttal discussion."}},
    ]],
  ["Initial meta-reviews due", "2026-10-26", null,
    [
      {text:"Clear accepts/rejects (reviewers agree): a short meta-review is fine."},
      {text:"Mixed opinions: a more detailed meta-review is expected.",
        howTo:{type:"text", body:"The available decisions are conditional accept, conditional reject, or requires clarification. Base the initial decision on the submission, reviews, and pre-rebuttal discussion. Requesting clarification is optional; decide with reviewers which papers need author input. If requesting it, list the key questions raised in reviews and discussion. If conditionally accepting or rejecting without clarification, give a clear rationale."}},
      {text:"Do not use LLMs to write meta-reviews"},
    ]],
  ["Reviews and preliminary decisions released to authors", "2026-10-27", null, []],
  ["Author rebuttals due", "2026-11-01", null, []],
  ["Reviewer / AC / PC discussions", "2026-11-02", "2026-11-20",
    [
      {text:"Engage in discussion for papers with author responses",
       howTo:{type:"text", body:"Discussion is mandatory for papers with diverging scores. Once you submit your review and discussion starts, you can see other submitted reviews. For papers with author responses, use the discussion to gather any information you need to make an informed decision and factor the responses into your final assessment. Reviewers have been notified that skipping discussion on papers with divergent scores is highly irresponsible and may lead to desk rejection of their own submission."}},
      {text:"Track whether reviewers are satisfied and how scores shift"},
      {text:"For any questions to your assigned PC, email: <a href=\"mailto:3dv27-pcs@googlegroups.com\"><strong>3dv27-pcs@googlegroups.com</strong></a>"},
    ]],
  ["Final meta-reviews due (draft)", "2026-11-20", null,
    [{text:"Finalize a draft of your meta-reviews.",
      howTo:{type:"text", body:"This is the last day for reviewers to finalize their reviews and reply in discussions. Use all information about the paper so far to make a decision and draft your final meta-review. The meta-review drafts will be used during your AC buddy meetings for discussion. If authors respond, assess the response and join the final discussion round. Authors will not be able to view the meta-review yet."}}]],
  ["AC / PC discussions, AC buddy meetings", "2026-11-21", "2026-11-24",
    [{text:"Finalize decisions with your paired AC",
      howTo:{type:"text", body:"Find the AC buddy assignment shared by the PCs in the OpenReview console. Your assigned PC monitors the process and is your point of contact. Send all questions directly to <a href=\"mailto:3dv27-pcs@googlegroups.com\">3dv27-pcs@googlegroups.com</a>."}}]],
  ["Final decisions and meta-reviews due", "2026-11-25", null,
    [{text:"Finalize meta-reviews and paper decisions",
      howTo:{type:"text", body:"This is the last chance to finalize the decisions and meta-reviews. Update your meta-reviews and decisions based on the AC buddy meeting. Choose whether accepted papers are recommended as orals or posters."}}]],
  ["Author notifications", "2026-12-02", null, ["Thank you for your service!"]],

function fmt(d){
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d, 0,0,0,0);
}
function calendarDaysBetween(start, end){
  const startUtc = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
  const endUtc = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
  return Math.round((endUtc - startUtc) / 86400000);
}

const container = document.getElementById('timeline');
const todayLabelEl = document.getElementById('todayLabel');
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme){
  const normalized = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', normalized);
  const nextTheme = normalized === 'dark' ? 'light' : 'dark';
  themeToggle.dataset.nextTheme = nextTheme;
  themeToggle.querySelector('.theme-label').textContent = nextTheme === 'light' ? 'Light mode' : 'Dark mode';
  localStorage.setItem('acTimelineTheme', normalized);
}

function realToday(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function render(refDate){
  todayLabelEl.textContent = "Today — " +
    refDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  container.innerHTML = '';
  const pastSteps = [];
  steps.forEach(([label, startStr, endStr, tasks, inactiveLabel])=>{
    const start = parseDate(startStr);
    const end = endStr ? parseDate(endStr) : start;

    let status = 'upcoming';
    if (refDate > end) status = 'done';
    else if (refDate >= start && refDate <= end) status = 'current';

    const rangeText = endStr ? `${fmt(start)} – ${fmt(end)}` : fmt(start);
    const daysLeft = calendarDaysBetween(refDate, end);
    const tag = status === 'done' ? 'Completed' : status === 'current'
      ? `Active now · ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} left`
      : 'Upcoming';
    const isPeriod = Boolean(endStr && endStr !== startStr);
    const metaLabel = isPeriod ? 'Review period' : 'Milestone';
    const displayLabel = status === 'current' ? label : inactiveLabel || label;

    const el = document.createElement('div');
    const isCurrent = status === 'current';
    el.className = `step ${status}${isPeriod ? ' period' : ' milestone'}${isCurrent ? ' current' : ''}`;

    let contentHtml = '';
    if (isCurrent || !tasks.length) {
      contentHtml = `
        <span class="status-tag">${tag}</span>
        <p class="title">${displayLabel}</p>
        ${tasks.length ? `<ul class="tasks">${tasks.map(t=>{
          if (typeof t === 'string') return `<li>${t}</li>`;
          let howtoHtml = '';
          if (t.howTo){
            const body = t.howTo.type === 'link'
              ? `<a href="${t.howTo.url}" target="_blank" rel="noopener">${t.howTo.label}</a>`
              : t.howTo.body;
            howtoHtml = `<details class="howto"><summary>How to do it</summary><div class="howto-body">${body}</div></details>`;
          }
          return `<li>${t.text}${howtoHtml}</li>`;
        }).join('')}</ul>` : ''}
      `;
    } else {
      contentHtml = `
        <details class="step-details">
          <summary>
            <span class="status-tag">${tag}</span>
            <p class="title">${displayLabel}</p>
          </summary>
          ${tasks.length ? `<ul class="tasks">${tasks.map(t=>{
            if (typeof t === 'string') return `<li>${t}</li>`;
            let howtoHtml = '';
            if (t.howTo){
              const body = t.howTo.type === 'link'
                ? `<a href="${t.howTo.url}" target="_blank" rel="noopener">${t.howTo.label}</a>`
                : t.howTo.body;
              howtoHtml = `<details class="howto"><summary>How to do it</summary><div class="howto-body">${body}</div></details>`;
            }
            return `<li>${t.text}${howtoHtml}</li>`;
          }).join('')}</ul>` : ''}
        </details>
      `;
    }

    el.innerHTML = `
      <div class="datecol">
        <div class="range">${rangeText}</div>
        <div class="meta">${metaLabel}</div>
      </div>
      <div class="marker"></div>
      <div class="content">${contentHtml}</div>
    `;
    if (status === 'done') pastSteps.push(el);
    else container.appendChild(el);
  });

  if (pastSteps.length) {
    const pastGroup = document.createElement('div');
    pastGroup.className = 'step done past-group-row';
    pastGroup.innerHTML = `
      <div class="datecol"></div>
      <div class="marker"></div>
      <div class="content">
        <details class="past-deadlines">
          <summary>
            <span class="past-label">Past Deadlines</span>
            <span class="past-count">${pastSteps.length} ${pastSteps.length === 1 ? 'entry' : 'entries'}</span>
          </summary>
          <div class="timeline past-timeline"></div>
        </details>
      </div>
    `;
    const pastTimeline = pastGroup.querySelector('.past-timeline');
    pastSteps.forEach(step => pastTimeline.appendChild(step));
    container.prepend(pastGroup);
  }
}

themeToggle.addEventListener('click', ()=>{
  const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(nextTheme);
});

const savedTheme = localStorage.getItem('acTimelineTheme') || 'light';
applyTheme(savedTheme);
render(realToday(), false);
</script>
</body>
</html>
